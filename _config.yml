# Site
title: "Hung X Nguyen"
description: "Personal academic website of Hung X Nguyen, Professor of Cybersecurity and Networking at Adelaide University"
url: https://hxnguyen.github.io
baseurl: ""
repository: "hxnguyen/hxnguyen.github.io"
locale: "en-US"
timezone: Australia/Adelaide

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Pages live in _pages/ and use the site layout unless they say otherwise
include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: archive

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
