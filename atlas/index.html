<title>Direction Atlas</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root {
  --ground: #fbfbfa; --ink: #16181c; --ink2: #50555e; --muted: #8a8f97; --rule: #e6e6e3; --soft: #f1f1ee;
  --accent: #1d5a86; --ok: #2a78d6; --poor: #ec835a; --back: #d03b3b; --yes: #1d6b4f; --part: #8a6a12;
  --k-lit: #3b6ea5; --k-prac: #b27617; --k-ours: #178270;
  --ev-c: #39414e; --ev-b: #7f8795; --ev-o: #c4c8cf; --ev-ag: #c0503c;
  --dirs-neg: #b3262b; --dirs-mid: #ecebe8; --dirs-pos: #1c5cab;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif; --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --ground: #131519; --ink: #e8e9eb; --ink2: #b2b7bf; --muted: #7f858e; --rule: #2a2e34; --soft: #1b1e23;
    --accent: #7fb3dc; --ok: #4a8be0; --poor: #cc7b22; --back: #b8334a; --yes: #6cc59f; --part: #d9b453;
    --k-lit: #78a6dc; --k-prac: #d9a24a; --k-ours: #4cc3a8;
    --ev-c: #d3d7dd; --ev-b: #8d949e; --ev-o: #6c737e; --ev-ag: #e0735e;
    --dirs-neg: #e66767; --dirs-mid: #2e3136; --dirs-pos: #3987e5; }
}
:root[data-theme="dark"] { color-scheme: dark; --ground: #131519; --ink: #e8e9eb; --ink2: #b2b7bf; --muted: #7f858e; --rule: #2a2e34; --soft: #1b1e23;
  --accent: #7fb3dc; --ok: #4a8be0; --poor: #cc7b22; --back: #b8334a; --yes: #6cc59f; --part: #d9b453;
  --k-lit: #78a6dc; --k-prac: #d9a24a; --k-ours: #4cc3a8;
  --ev-c: #d3d7dd; --ev-b: #8d949e; --ev-o: #6c737e; --ev-ag: #e0735e;
  --dirs-neg: #e66767; --dirs-mid: #2e3136; --dirs-pos: #3987e5; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font: 15px/1.55 var(--sans); padding-inline: 16px; padding-block: 0 64px; }
.wrap { max-width: 1040px; margin: 0 auto; }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header { padding-block: 40px 4px; }
h1 { font: 400 clamp(30px, 5vw, 44px)/1.1 var(--serif); margin: 0 0 8px; letter-spacing: -.01em; }
.lede { color: var(--ink2); margin: 0; }
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--ground); display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--rule); margin-top: 22px; }
nav::-webkit-scrollbar { display: none; }
nav.fade-r { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); }
nav button { background: none; border: 0; padding: 12px 0 10px; color: var(--muted); cursor: pointer; white-space: nowrap; border-bottom: 1.5px solid transparent; }
nav button:hover { color: var(--ink); }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
nav .gap { flex: none; width: 1px; background: var(--rule); margin: 10px 0; }
section[role="tabpanel"] { padding-top: 28px; }
h2 { font: 400 24px/1.25 var(--serif); margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--ink2); margin: 0 0 18px; max-width: 70ch; }
.num { font-variant-numeric: tabular-nums; }
.mute { color: var(--muted); }
.small { font-size: 13px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

canvas.thumb { border-radius: 2px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) canvas.thumb { filter: brightness(1.35) contrast(1.25); } }
:root[data-theme="dark"] canvas.thumb { filter: brightness(1.35) contrast(1.25); }

/* the one hover box */
.tipg { position: fixed; pointer-events: none; background: var(--ink); color: var(--ground); font: 12.5px/1.45 var(--sans); padding: 7px 10px; border-radius: 4px; max-width: 290px; z-index: 30; }
.tipg b { font-weight: 500; display: block; }
.tipg .m { display: block; opacity: .72; }

/* theme overview */
.ov { margin: 0 0 8px; position: relative; }
.ov svg { display: block; width: 100%; touch-action: pan-x pan-y; }
.ov .ax { font: 11px var(--mono); fill: var(--muted); }
.ov .axl { font: 11.5px var(--sans); fill: var(--ink2); }
.ov .grid { stroke: var(--rule); stroke-width: 1; }
.ov .zero { stroke: var(--muted); stroke-width: 1; }
.ov .band { fill: var(--soft); }
.ov .dt { stroke: var(--ground); stroke-width: 1.5; cursor: pointer; }
.ov .dt.hl { stroke: var(--ink); stroke-width: 2; }
.ov svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.k-literature { fill: var(--k-lit); background: var(--k-lit); } .k-practice { fill: var(--k-prac); background: var(--k-prac); } .k-ours { fill: var(--k-ours); background: var(--k-ours); }
.leg { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink2); margin: 2px 0 16px; }
.leg span { display: inline-flex; align-items: center; gap: 6px; }
.leg i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.leg i.sq { border-radius: 1px; width: 12px; height: 7px; }
.leg .ev-c { background: var(--ev-c); } .leg .ev-b { background: var(--ev-b); } .leg .ev-o { background: var(--ev-o); } .leg .ev-ag { background: var(--ev-ag); }
.leg.bars { margin: 0 0 6px; }

/* family filter */
.fams { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.fams button { background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--ink2); cursor: pointer; }
.fams button:hover { border-color: var(--muted); color: var(--ink); }
.fams button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }
.fams button span { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .fams { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; } .fams::-webkit-scrollbar { display: none; } .fams button { flex: none; white-space: nowrap; } }

/* item rows */
.items { border-top: 1px solid var(--rule); }
.it { border-bottom: 1px solid var(--rule); scroll-margin-top: 60px; }
.it.flash { background: var(--soft); }
.it-h { display: grid; grid-template-columns: 184px minmax(0, 1fr); gap: 6px 18px; align-items: center; padding: 10px 0; }
.it-g { width: 184px; min-height: 30px; display: flex; align-items: center; }
.it-g svg, .it-g canvas { display: block; }
button.it-g { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 3px; }
button.it-g:hover { background: var(--soft); }
.it-g .open { font-size: 11px; color: var(--accent); margin-left: 6px; white-space: nowrap; }
.it-t { all: unset; box-sizing: border-box; cursor: pointer; display: block; min-width: 0; border-radius: 2px; }
.it-t:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.it-t:hover .it-title { color: var(--accent); }
.it-title { font: 400 17px/1.3 var(--serif); display: flex; gap: 8px; align-items: baseline; text-wrap: balance; }
.it-title i { flex: none; width: 8px; height: 8px; border-radius: 50%; display: inline-block; transform: translateY(-1px); }
.it-line { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; color: var(--ink2); font-size: 13.5px; margin-top: 2px; }
.it-t[aria-expanded="true"] .it-line { display: block; -webkit-line-clamp: unset; line-clamp: unset; }
.chip { display: inline-block; margin-top: 5px; font-size: 11.5px; line-height: 1.5; color: var(--muted); border: 1px solid var(--rule); border-radius: 3px; padding: 0 6px; }
.it-d { padding: 0 0 16px 202px; display: grid; gap: 12px; }
.it-d blockquote { margin: 0; font: italic 400 16px/1.5 var(--serif); color: var(--ink); max-width: 70ch; }
.it-d blockquote button { font: 12px var(--mono); font-style: normal; margin-left: 6px; }
.nums { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, max-content); gap: 4px 16px; font-size: 13px; margin: 0; max-width: 640px; }
.nums dt { color: var(--ink2); } .nums dt .fm { color: var(--muted); font-size: 12px; margin-right: 6px; }
.nums dd { margin: 0; font-family: var(--mono); font-size: 12.5px; max-width: 34ch; }
.nums dt, .nums dd { padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
.pchips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.pchips .lab { font-size: 12px; color: var(--muted); margin-right: 4px; }
.pchip { font: 11.5px var(--mono); background: var(--soft); border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; cursor: pointer; color: var(--ink2); }
.pchip:hover { color: var(--ink); border-color: var(--muted); }
.pchip.ag { color: var(--ev-ag); border-color: color-mix(in srgb, var(--ev-ag) 45%, transparent); background: none; }
.acts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
.showall { margin-top: 14px; }
@media (max-width: 600px) {
  .it-h { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .it-d { padding-left: 0; }
  .nums { grid-template-columns: minmax(0, 1fr); gap: 0; } .nums dt { border: 0; padding: 4px 0 0; } .nums dd { max-width: none; }
}

/* dialog for cases and problems */
dialog.full { border: 1px solid var(--rule); border-radius: 6px; background: var(--ground); color: var(--ink); padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 64px); }
dialog.full::backdrop { background: rgba(10, 12, 16, .45); }
.full-h { position: sticky; top: 0; background: var(--ground); display: flex; align-items: baseline; gap: 12px; padding: 16px 18px 10px; border-bottom: 1px solid var(--rule); }
.full-h h2 { flex: 1; margin: 0; font-size: 21px; }
.full-b { padding: 8px 18px 18px; }
.case { border-bottom: 1px solid var(--rule); scroll-margin-top: 70px; }
.case.hit { background: var(--soft); }
.case summary { cursor: pointer; padding: 10px 4px; list-style: none; display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.case summary::-webkit-details-marker { display: none; }
.case summary i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.case summary b { font: 400 16px/1.35 var(--serif); display: block; }
.case summary span.m { font-size: 12px; color: var(--muted); }
.case .cb { padding: 0 4px 14px 26px; font-size: 14px; display: grid; gap: 8px; }
.case .cb p { margin: 0; max-width: 66ch; }
.case .cb blockquote { margin: 0; font: italic 400 15px/1.5 var(--serif); color: var(--ink2); }
.st-strong { background: var(--back); } .st-moderate { background: var(--poor); } .st-weak { background: var(--ev-b); } .st-unrated { background: var(--ev-o); }
.prb { display: grid; grid-template-columns: minmax(0, 1fr) 40%; gap: 4px 14px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--rule); cursor: pointer; }
.prb:hover, .prb.hit { background: var(--soft); }
.prb .n { font-size: 14px; }
.prb .tr { height: 10px; background: var(--soft); border-radius: 2px; position: relative; }
.prb .tr i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ev-c); border-radius: 2px; }
.prb.hit .tr i { background: var(--accent); }
.prb .x { grid-column: 1 / -1; font-size: 13px; color: var(--ink2); max-width: 70ch; }
@media (max-width: 600px) { .prb { grid-template-columns: minmax(0, 1fr); } }

/* datasets */
#detail:focus { outline: none; }
.facts { color: var(--ink2); font-size: 14px; margin: 0 0 12px; }
.note { color: var(--ink2); font-size: 14px; max-width: 64ch; margin: 0 0 14px; }
.go-harm { background: none; border: 0; padding: 0; color: var(--back); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: 14px; }
#dsview:focus { outline: none; }
.dsnav { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin: 0 0 18px; font-size: 14px; }
.dsnav .spacer { flex: 1; }
.dsnav button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }
.dsnav button:disabled { color: var(--muted); cursor: default; }
#dsview h2 { margin-bottom: 8px; }
.alist { max-width: 860px; margin-top: 10px; }
.arow, .ahead { display: grid; grid-template-columns: minmax(110px, 34%) 1fr 52px 84px; gap: 12px; align-items: center; }
.arow { padding: 3px 6px; border-radius: 3px; font-size: 13.5px; }
.arow .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.arow .val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.trk { position: relative; height: 16px; }
.trk::before { content: ""; position: absolute; left: 0; right: 0; top: 7.5px; height: 1px; background: var(--rule); }
.trk u { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--muted); }
.trk u.l7 { border-left-style: dotted; opacity: .7; }
.trk i { position: absolute; top: 3px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--ok); opacity: .45; }
.arow.poor, .arow.back { background: color-mix(in srgb, var(--poor) 9%, transparent); }
.arow.back { background: color-mix(in srgb, var(--back) 9%, transparent); }
.arow.poor .lab, .arow.back .lab { color: var(--ink); font-weight: 500; }
.arow.poor .val { color: color-mix(in srgb, var(--poor) 75%, var(--ink)); font-weight: 500; }
.arow.back .val { color: var(--back); font-weight: 500; }
.arow.poor .trk i { background: var(--poor); opacity: 1; width: 12px; height: 12px; top: 2px; margin-left: -6px; }
.arow.back .trk i { background: var(--back); opacity: 1; width: 12px; height: 12px; top: 2px; margin-left: -6px; }
.arow.hit { box-shadow: inset 3px 0 0 var(--accent); }
.arow { cursor: pointer; } .arow:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
.arow.hit .trk i { box-shadow: 0 0 0 2px var(--ground), 0 0 0 4px var(--accent); }
.ahead { font: 11px var(--mono); color: var(--muted); padding: 0 6px 4px; }
.ahead .trk { height: 30px; }
.ahead .trk::before { display: none; }
.ahead .trk span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.ahead .trk b { position: absolute; bottom: 2px; width: 8px; height: 8px; margin-left: -4px; transform: rotate(45deg); background: var(--ink); }
.ahead .trk em { position: absolute; bottom: 0; font-style: normal; transform: translateX(-100%); padding-right: 8px; color: var(--ink2); }
.arow .cs { font-size: 12.5px; }
.cases-top { margin: 0 0 12px; font-size: 14px; }
@media (max-width: 560px) { .ahead .trk .cf { display: none; } .arow, .ahead { grid-template-columns: minmax(80px, 38%) 1fr 44px; } .ahead .csh { display: none; } .arow .cs { grid-column: 1 / -1; } .arow .cs:empty { display: none; } }
/* One row per dataset. Every selector is scoped under .opt-rows. */
.opt-rows { position: relative; color: var(--ink); font-size: 14px; line-height: 1.45; --or-sticky: 45px; }
.opt-rows button { font: inherit; color: inherit; }
.opt-rows .or-cap { margin: 0 0 10px; color: var(--ink2); max-width: 68ch; }
.opt-rows .or-legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 12.5px; color: var(--ink2); margin: 0 0 14px; }
.opt-rows .or-legend span { display: inline-flex; align-items: center; gap: 7px; }
.opt-rows .or-legend svg { display: block; overflow: visible; flex: none; }
.opt-rows .or-row { display: grid; grid-template-columns: var(--or-cols); column-gap: var(--or-gap); align-items: center; border-bottom: 1px solid var(--rule); }
.opt-rows .or-head { position: sticky; top: var(--or-sticky, 0px); z-index: 2; background: var(--ground); align-items: end; padding-bottom: 6px; border-bottom-color: var(--muted); }
.opt-rows .or-ds:hover, .opt-rows .or-ds:focus-within { background: var(--soft); }
.opt-rows .or-ds.or-sel { background: var(--soft); box-shadow: inset 2px 0 0 var(--accent); }
.opt-rows .or-name { min-width: 0; padding: 5px 0 5px 8px; display: flex; flex-direction: column; }
.opt-rows .or-htxt, .opt-rows .or-axt { font-size: 12px; color: var(--muted); }
.opt-rows .or-axt { padding-left: 6px; }
.opt-rows .or-ptxt { font-size: 13.5px; color: var(--ink); font-weight: 500; }
.opt-rows .or-nm { background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; font-size: 13.5px; line-height: 1.3; color: var(--ink); border-radius: 2px; }
.opt-rows .or-nm:hover { color: var(--accent); }
.opt-rows .or-nm:focus-visible, .opt-rows .or-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt-rows .or-sub { display: flex; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; line-height: 1.35; }
.opt-rows .or-sub-g { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.opt-rows .or-v { flex: none; font-variant-numeric: tabular-nums; }
.opt-rows .or-strip { display: block; overflow: visible; }
.opt-rows .or-ds .or-strip { cursor: pointer; }
.opt-rows .or-ok { fill: var(--ok); }
.opt-rows .or-poor { fill: var(--poor); }
.opt-rows .or-back { fill: var(--back); }
.opt-rows .or-dot { stroke: var(--ground); stroke-width: 1.5; }
.opt-rows .or-ring { fill: none; stroke: var(--ink); stroke-width: 1.3; }
.opt-rows .or-dia { fill: var(--ink); stroke: var(--ground); stroke-width: 1.5; }
.opt-rows .or-hl { fill: none; stroke: var(--accent); stroke-width: 2; pointer-events: none; }
.opt-rows .or-g5 { stroke: var(--muted); stroke-width: 1; }
.opt-rows .or-g7 { stroke: var(--rule); stroke-width: 1; }
.opt-rows .or-base { stroke: var(--rule); stroke-width: 1; }
.opt-rows .or-tick { stroke: var(--muted); stroke-width: 1; }
.opt-rows .or-zone { font-size: 12px; fill: var(--ink2); }
.opt-rows .or-tl { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.opt-rows .or-pl { font-size: 11.5px; fill: var(--muted); }
.opt-rows .or-tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--ground); font-size: 12.5px; line-height: 1.45; padding: 7px 10px; border-radius: 4px; max-width: 290px; z-index: 5; }
.opt-rows .or-tip b { font-weight: 500; display: block; }
.opt-rows .or-tip .or-tm { opacity: .72; }
.opt-rows .or-toggle { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; border-radius: 2px; }
.opt-rows.or-narrow .or-row { grid-template-columns: minmax(0, 1fr); }
.opt-rows.or-narrow .or-name { grid-row: 1; flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 0 8px; padding: 7px 0 0; }
.opt-rows.or-narrow .or-row > .or-strip, .opt-rows.or-narrow .or-axcell { grid-row: 2; }
.opt-rows.or-narrow .or-ds .or-sub { display: none; }
.opt-rows.or-narrow .or-head .or-name { padding-bottom: 4px; }
.opt-rows .or-band { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 22px 0 6px 8px; border-bottom: 1px solid var(--rule); }
.opt-rows .or-band h3 { font: 400 17px/1.3 var(--serif); margin: 0; }
.opt-rows .or-band span { font-size: 13px; color: var(--muted); }
.opt-rows .or-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.opt-rows .or-tag { flex: none; font-size: 11.5px; color: var(--ink2); border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; line-height: 1.5; }

/* Direction map. Every selector is scoped under .dirs. */
.dirs { --dirs-gut: 112px; position: relative; color: var(--ink); font-size: 14px; line-height: 1.5; }
.dirs button { font: inherit; color: inherit; }
.dirs .dirs-fam { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin: 0 0 6px; font-size: 13.5px; }
.dirs .dirs-fam-l { color: var(--muted); font-size: 12.5px; }
.dirs .dirs-fam button { background: none; border: 0; padding: 0 0 2px; color: var(--muted); cursor: pointer; border-bottom: 1.5px solid transparent; white-space: nowrap; }

<script>

    render(60);
  }
  const mkm = (k, m) => m === "yes" ? `<b>${k}</b>` : m === "partial" ? `<i>${k}</i>` : `<s>${k}</s>`;
  function render(n) {
    shown = Math.min(n, plist.length);
    $("#p-count").textContent = `${plist.length} of ${DATA.papers.length}` + (plist.length > shown ? `, showing ${shown}` : "");
    $("#plist").innerHTML = plist.slice(0, shown).map(p => `<div class="prow"><button data-id="${esc(p.id)}" aria-expanded="${open.has(p.id)}"><span><span class="pt">${esc(p.title)}</span><br><span class="small mute">${esc(p.venue || STR[p.stratum])}${p.year ? " " + esc(p.year) : ""} \u00b7 ${esc(p.id)}</span></span><span class="marks" title="A to E, and G for the per-group reading">${"ABCD".split("").map(k => mkm(k, p.codes[k].m)).join("")}${mkm("E", p.E)} ${mkm("G", p.G.G1)}</span></button><div class="pdetail" ${open.has(p.id) ? "" : "hidden"}>${open.has(p.id) ? detail(p) : ""}</div></div>`).join("");
    if (!plist.length) $("#plist").innerHTML = `<p class="mute">No papers match.</p>`;
    $("#p-more").hidden = shown >= plist.length;
  }
  function detail(p) {
    const row = (lab, m, q) => `<dt>${lab}</dt><dd>${m ? esc(m) : ""}${q ? `<blockquote>\u201c${esc(q)}\u201d</blockquote>` : ""}</dd>`;
    const g = p.G, gtxt = g.G1 !== "yes" ? "no" : ["yes", g.G2 === "yes" ? "held out" : "not held out", g.G3 === "yes" ? "a weak group shown" : "no weak group shown", g.G3 === "yes" ? (g.G4 === "yes" ? "claim qualified" : "claim left standing") : ""].filter(Boolean).join(", ");
    return `<dl class="q">${row("Concept", p.concept)}${row("How it is found", p.estimator)}${row("Groups", p.groups)}
      ${"ABCD".split("").map(k => row(`${k}. ${MARKS[k]}`, p.codes[k].m, p.codes[k].q)).join("")}${row(`E. ${MARKS.E}`, p.E)}
      ${row("Per-group reading", gtxt, p.Gq)}${row("Layer", (L1N[p.L1] || "") + (p.L3 && p.L3 !== "unclear" ? `, at ${Math.round(100 * p.L3)}% of depth` : ""), p.L1q)}${row("Token", T1N[p.T1] || "", p.T1q)}</dl>
      ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener" class="small">Open the paper</a>` : ""}`;
  }
})();
</script>
